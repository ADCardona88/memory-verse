<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Memory Verse</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="name-screen">
      <h1>Memory Verse</h1>

      <section id="name-form" hidden>
        <label for="name-input">What's your name?</label>
        <form id="welcome-form">
          <input
            id="name-input"
            type="text"
            name="name"
            maxlength="30"
            autocomplete="name"
            required
          />
          <button type="submit">Continue</button>
        </form>
      </section>
    </main>

    <div id="practice-flow" hidden>
      <section id="read-section" class="snap-section">
        <h1>Memory Verse</h1>
        <p>Welcome back, <span id="welcome-name"></span>.</p>
        <p id="verse-reference" class="verse-reference"></p>
        <p id="verse-text" class="verse-text"></p>
        <p class="scroll-hint">Scroll down to practice</p>
      </section>

      <section id="practice-section" class="snap-section">
        <label for="practice-input">Type the verse from memory</label>
        <textarea
          id="practice-input"
          rows="5"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
        ></textarea>
        <p id="congratulations" hidden>Congratulations!</p>
      </section>
    </div>

    <script src="verse-check.js"></script>
    <script src="app.js"></script>
  </body>
</html>
