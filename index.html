<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Memory Verse</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Memory Verse</h1>

      <section id="name-form" hidden>
        <label for="name-input">What's your name?</label>
        <form id="welcome-form">
          <input
            id="name-input"
            type="text"
            name="name"
            maxlength="30"
            autocomplete="name"
            required
          />
          <button type="submit">Continue</button>
        </form>
      </section>

      <section id="welcome" hidden>
        <p>Welcome back, <span id="welcome-name"></span>.</p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
